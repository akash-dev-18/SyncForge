services:
  postgres:
    image: postgres:18-alpine
    container_name: syncengine-postgres
    environment:
      POSTGRES_USER: syncengine
      POSTGRES_PASSWORD: syncengine
      POSTGRES_DB: syncengine
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - syncengine-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncengine -d syncengine"]
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    build: .
    image: syncengine-server:local
    container_name: syncengine-server
    environment:
      DATABASE_URL: postgres://syncengine:syncengine@postgres:5432/syncengine
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  syncengine-pgdata:
